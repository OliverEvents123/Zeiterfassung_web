<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeiterfassung</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #6b7280;
      --line: #e3e5e9;
      --accent: #2f5d50;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 14px;
      font-weight: 600;
    }
    .status { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #d97706; flex: none;
    }
    .hint {
      font-size: 13px; color: var(--muted);
      margin: 12px 0 0; padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    footer {
      text-align: center; font-size: 12px;
      color: var(--muted); margin-top: 28px;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; background: var(--bg);
      padding: 1px 5px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <h1>Zeiterfassung</h1>
    <p class="sub">Testseite &middot; Aufbau Schritt fu&#776;r Schritt</p>

    <div class="card">
      <h2>Auftragsnummern</h2>
      <div class="status">
        <span class="dot"></span>
        <span>Noch keine Verbindung zu FileMaker</span>
      </div>
      <p class="hint">
        Hier erscheint gleich die Liste aus dem Layout <code>api_auftragsnr</code>,
        sobald der Vermittler bei Supabase steht.
      </p>
    </div>

    <footer>Wenn du das auf dem Handy siehst, funktioniert die Kette bis hierher.</footer>

  </div>
</body>
</html>
