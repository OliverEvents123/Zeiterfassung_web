  <style>
    :root{
      --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280;
      --line:#e3e5e9; --gruen:#1f7a58; --rot:#b4442e; --akzent:#215aa8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5;-webkit-font-smoothing:antialiased
    }
    .wrap{max-width:460px;margin:0 auto}
    .kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:24px}
    .kopf h1{margin:0;font-size:24px}
    .kopf .sub{margin:1px 0 0}
    .logo{height:52px;width:auto;flex:none;margin-top:2px}
    .links{margin-top:8px;white-space:nowrap}
    h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
    .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
    .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 14px;font-weight:600}

    label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
    input,select,textarea{
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font-size:16px;font-family:inherit;background:var(--card);color:var(--text)
    }
    input:disabled,select:disabled,textarea:disabled{background:#f0f1f3;color:var(--muted)}
    textarea{resize:vertical;min-height:60px}

    /* iOS gibt Datums- und Zeitfeldern eine eigene Mindestbreite und zentriert
       den Text. Beides abschalten, sonst ragen sie aus ihrem Kasten heraus. */
    input[type=date],input[type=time]{
      -webkit-appearance:none;appearance:none;
      min-width:0;max-width:100%;text-align:left;
    }
    select{-webkit-appearance:none;appearance:none;min-width:0;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                       linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 16px) calc(50% + 2px),calc(100% - 11px) calc(50% + 2px);
      background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

    .reihe{display:flex;gap:10px;margin-bottom:14px}
    .reihe>div{flex:1;min-width:0}

    @media (max-width:400px){
      .reihe{gap:7px}
      input,select{padding:10px 9px}
      select{padding-right:26px}
    }

    .abmelden{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
      font-family:inherit;padding:0;text-decoration:underline}

    .art{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
    .art button{padding:10px 4px;border:1px solid var(--line);border-radius:9px;background:var(--card);
      color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
    .art button.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff}

    .zeile{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
    .zeile .kopf{display:flex;gap:8px;align-items:flex-start}
    .suchfeld{position:relative;flex:1;min-width:0}
    .suchfeld input{background:var(--card)}
    .weg{flex:none;width:38px;height:42px;border:1px solid var(--line);border-radius:8px;
      background:var(--card);color:var(--muted);cursor:pointer;font-size:17px;line-height:1}
    .nrname{display:block;font-size:12px;color:var(--akzent);margin:5px 2px 0;min-height:16px}
    .unten{display:flex;gap:8px;margin-top:10px}
    .unten .std{flex:0 0 84px;text-align:center}
    .unten .txt{flex:1;min-width:0}

    .vorschlag{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--card);
      border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.10);
      max-height:230px;overflow-y:auto;display:none}
    .vs{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
    .vs:last-child{border-bottom:none}
    .vs:hover,.vs.hell{background:var(--bg)}
    .vs b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted);margin-right:8px}

    .bestand{margin:0 0 16px;padding:0;list-style:none}
    .bestand li{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
    .bestand li:last-child{border-bottom:none}
    .bestand .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);min-width:46px}
    .bestand .s{font-variant-numeric:tabular-nums;min-width:44px}
    .bestand .t{flex:1;color:var(--muted)}

    .rest{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
      padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
    .rest b{color:var(--text);font-variant-numeric:tabular-nums}
    .rest.warn b{color:var(--rot)}

    .knopf{width:100%;padding:14px;border:none;border-radius:9px;background:var(--akzent);
      color:#fff;font-size:16px;font-family:inherit;cursor:pointer;margin-top:6px}
    .knopf:disabled{opacity:.45;cursor:default}
    .klein{width:auto;padding:8px 14px;background:var(--card);color:var(--text);
      border:1px solid var(--line);font-size:14px;border-radius:8px;cursor:pointer}

    .melde{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}
    .melde.ok{background:#eef6f1;border:1px solid #cfe4d8;color:#1f5741}
    .melde.err{background:#fdf3f1;border:1px solid #f0d5cd;color:#7a3122}
    .melde.info{background:#f2f4f7;border:1px solid var(--line);color:var(--muted)}
    .melde b{display:block;margin-bottom:3px}

    .hinweis{font-size:13px;color:var(--muted);margin:10px 0 0}
    footer{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
  </style>
</head>

    </div>
  </div>

  <div class="card" id="card-auftraege">
    <h2>Aufteilung auf Auftragsnummern</h2>

    <div id="bereits"></div>

    <div id="zeilen"></div>
    <button class="klein" id="plus">+ Zeile hinzufügen</button>
    <div class="rest" id="rest"><span>Zu verteilen</span><b>&ndash;</b></div>

    <div style="margin-top:16px">
      <label for="taetigkeit">Tätigkeiten (wenn nicht auf Auftrag gebucht)</label>
      <textarea id="taetigkeit" placeholder="optional"></textarea>
    </div>
  </div>

  <button class="knopf" id="senden">Übermitteln</button>
  <footer>Daten gehen direkt nach FileMaker</footer>
</div>

<script>
// ═══════════ Einstellungen ═══════════
const SUPABASE_URL = "https://mawgxgqhnnzjdlmwedvm.supabase.co";
const SUPABASE_KEY = "sb_publishable_JbKapp3l4TBTHxBuscHPUg_t47XXsbI";

const F_NUMMERN   = SUPABASE_URL + "/functions/v1/auftragsnummern";
const F_ZEIT      = SUPABASE_URL + "/functions/v1/zeit-schreiben";

const ARTEN = ["Arbeit", "Ferien", "Krank", "Militär"];
// ═════════════════════════════════════

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let art = "Arbeit";
let nummern = [];
let stand = null;          // was der Server über den gewählten Tag sagt

// ═══════════ Anmeldung ═══════════
const SP = {
  get token()   { return localStorage.getItem("ze_token"); },
  get refresh() { return localStorage.getItem("ze_refresh"); },
  set(d) {
    localStorage.setItem("ze_token", d.access_token);
    localStorage.setItem("ze_refresh", d.refresh_token);
  },
  weg() { localStorage.removeItem("ze_token"); localStorage.removeItem("ze_refresh"); },
};

async function anmelden(email, passwort) {
  const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: passwort }),
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || "Anmeldung fehlgeschlagen");
  SP.set(d);
}

async function erneuern() {
  const rt = SP.refresh;
  if (!rt) return false;
  const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: rt }),
  });
  if (!r.ok) return false;
  const d = await r.json();
  if (!d.access_token) return false;
  SP.set(d);
  return true;
}

// Ruft eine Edge Function auf. Läuft der Token ab, wird er einmal erneuert.
async function api(url, optionen = {}, zweiterVersuch = false) {
  const r = await fetch(url, {
    ...optionen,
    headers: {
      ...(optionen.headers || {}),
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SP.token,
    },
  });
  if (r.status === 401 && !zweiterVersuch) {
    if (await erneuern()) return api(url, optionen, true);
    abmelden();
    throw new Error("Sitzung abgelaufen");
  }
  return r;
}

function zeigeLogin(text) {
  $("seite-login").style.display = "";
  $("seite-app").style.display = "none";
  $("login-meldung").innerHTML = text
    ? '<div class="melde err">' + esc(text) + '</div>' : "";
}

function abmelden() {
  SP.weg();
  zeigeLogin("");
}

async function starten() {
  if (!SP.token) return zeigeLogin("");
  $("seite-login").style.display = "none";
  $("seite-app").style.display = "";
  await ladeNummern();
  await ladeTag();
}

// ═══════════ Art ═══════════
function zeichneArt() {
  $("art").innerHTML = ARTEN.map(a =>
    '<button data-art="' + a + '" class="' + (a === art ? "aktiv" : "") + '">' + a + '</button>').join("");
  $("art").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      art = b.dataset.art; zeichneArt(); umschalten();
      if (art === "Arbeit") ladeTag();
    }));
}

function umschalten() {
  const sonder = art !== "Arbeit";
  $("block-arbeit").style.display   = sonder ? "none" : "";
  $("block-sonder").style.display   = sonder ? "" : "none";
  $("card-auftraege").style.display = sonder ? "none" : "";
}

// ═══════════ Auftragsnummern ═══════════
async function ladeNummern() {
  try {
    const r = await api(F_NUMMERN + "?jahr=" + new Date().getFullYear());
    const d = await r.json();
    nummern = d.ok ? (d.auftragsnummern || []) : [];
  } catch (e) { nummern = []; }
}

const nameZu = (id) => (nummern.find(a => a.id === String(id).trim()) || {}).name || "";

// ═══════════ Stand des Tages laden ═══════════
async function ladeTag() {
  if (art !== "Arbeit") return;
  const datum = $("datum").value;
  if (!datum) return;

  melde("info", "", "Lade Stand des Tages…");
  try {
    const r = await api(F_ZEIT + "?datum=" + datum);
    const d = await r.json();
    if (!d.ok) { melde("err", "Fehler", d.fehler || "Unbekannt"); return; }
    stand = d;
    melde("", "", "");
    anwenden();
  } catch (e) {
    melde("err", "Keine Verbindung", String(e.message || e));
  }
}

function anwenden() {
  if (!stand) return;

  $("wer").textContent = stand.mitarbeiter.name + " · MA " + stand.mitarbeiter.maId;
  $("datum").max = stand.heute;

  const s = stand.stand;

  // Zeiten vorbelegen, wenn schon etwas erfasst ist
  if (s) {
    if (s.beginn) $("beginn").value = s.beginn;
    if (s.ende)   $("ende").value = s.ende;
    if (s.pause)  waehlePause(s.pause);
  }

  // Zeitfelder sperren, wo nötig
  const zeitenAuf = stand.zeitenAenderbar;
  ["beginn", "ende", "pause"].forEach(id => $(id).disabled = !zeitenAuf);
  $("taetigkeit").disabled = !zeitenAuf;

  // Hinweis zu den Zeiten
  let hinweis = "";
  if (stand.gesperrt) {
    hinweis = "Dieser Tag ist älter als " + stand.maxRueckwirkend + " Tage und komplett gesperrt. Erfassung nur noch in FileMaker.";
  } else if (s && !zeitenAuf) {
    hinweis = "Die Zeiten für diesen Tag sind bereits erfasst und nicht mehr änderbar. Auftragsnummern kannst du weiterhin ergänzen.";
  } else if (s) {
    hinweis = "Für heute ist bereits erfasst. Änderst du die Zeiten, wird der Eintrag überschrieben.";
  }
  $("zeit-hinweis").innerHTML = hinweis ? '<div class="melde info">' + esc(hinweis) + '</div>' : "";

  // Bereits erfasste Auftragszeilen anzeigen
  const b = (s && s.zeilen && s.zeilen.length) ? s.zeilen : [];
  $("bereits").innerHTML = b.length
    ? '<h2 style="margin-top:0">Bereits erfasst</h2><ul class="bestand">' + b.map(z =>
        '<li><span class="n">' + esc(z.nr) + '</span><span class="s">' + esc(z.stunden) + '</span>' +
        '<span class="t">' + esc(z.text || nameZu(z.nr)) + '</span></li>').join("") +
      '</ul><h2>Ergänzen</h2>'
    : "";

  // Eingabe für neue Zeilen
  const zeilenAuf = stand.zeilenErgaenzbar;
  $("zeilen").style.display = zeilenAuf ? "" : "none";
  $("plus").style.display = zeilenAuf ? "" : "none";
  if (zeilenAuf && !document.querySelector("#zeilen .zeile")) neueZeile();

  $("senden").disabled = stand.gesperrt;
  $("senden").textContent = s ? (zeitenAuf ? "Aktualisieren" : "Auftragsnummern ergänzen") : "Übermitteln";

  rechne();
}

function waehlePause(wert) {
  const p = $("pause");
  const kurzWert = wert.length > 5 ? wert.slice(0, 5) : wert;
  for (const o of p.options) if (o.value === kurzWert || o.value === kurzWert.replace(/^0/, "")) { p.value = o.value; return; }
}

// ═══════════ Auftragszeile ═══════════
function neueZeile() {
  const div = document.createElement("div");
  div.className = "zeile";
  div.innerHTML =
    '<div class="kopf">' +
      '<div class="suchfeld">' +
        '<input class="nr" placeholder="Auftragsnummer oder Name" autocomplete="off">' +
        '<div class="vorschlag"></div>' +
      '</div>' +
      '<button class="weg" title="Zeile entfernen">&times;</button>' +
    '</div>' +
    '<small class="nrname"></small>' +
    '<div class="unten">' +
      '<input class="std" placeholder="1:30" inputmode="decimal">' +
      '<input class="txt" placeholder="Beschreibung">' +
    '</div>';
  div.querySelector(".weg").addEventListener("click", () => { div.remove(); rechne(); });
  div.querySelector(".std").addEventListener("input", rechne);
  suche(div.querySelector(".nr"), div.querySelector(".vorschlag"), div.querySelector(".nrname"));
  $("zeilen").appendChild(div);
  rechne();
}

function suche(feld, box, namensZeile) {
  let treffer = [], markiert = -1;
  const schliessen = () => { box.style.display = "none"; markiert = -1; };

  function zeichnen() {
    box.innerHTML = treffer.map((a, i) =>
      '<div class="vs' + (i === markiert ? " hell" : "") + '" data-id="' + esc(a.id) + '">' +
      '<b>' + esc(a.id) + '</b>' + esc(a.name) + '</div>').join("");
    box.style.display = treffer.length ? "block" : "none";
  }
  function uebernehmen(id) {
    feld.value = id; namensZeile.textContent = nameZu(id); schliessen();
  }

  feld.addEventListener("input", () => {
    const q = feld.value.trim().toLowerCase();
    namensZeile.textContent = nameZu(feld.value);
    if (!q) { treffer = []; schliessen(); return; }
    treffer = nummern.filter(a => a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q)).slice(0, 12);
    markiert = treffer.length ? 0 : -1;
    zeichnen();
  });
  feld.addEventListener("keydown", (e) => {
    if (box.style.display !== "block") return;
    if (e.key === "ArrowDown") { e.preventDefault(); markiert = Math.min(markiert + 1, treffer.length - 1); zeichnen(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); markiert = Math.max(markiert - 1, 0); zeichnen(); }
    else if (e.key === "Enter") { e.preventDefault(); if (treffer[markiert]) uebernehmen(treffer[markiert].id); }
    else if (e.key === "Escape") schliessen();
  });
  box.addEventListener("mousedown", (e) => {
    const el = e.target.closest(".vs");
    if (!el) return;
    e.preventDefault(); uebernehmen(el.dataset.id);
  });
  feld.addEventListener("blur", () => setTimeout(schliessen, 120));
}

// ═══════════ Rechnen ═══════════
function minuten(s) {
  if (!s) return 0;
  s = String(s).trim().replace(",", ".");
  if (s.includes(":")) { const [h, m] = s.split(":"); return (parseInt(h,10)||0)*60 + (parseInt(m,10)||0); }
  const d = parseFloat(s); return isNaN(d) ? 0 : Math.round(d * 60);
}
function alsZeit(min) {
  const v = min < 0 ? "-" : ""; min = Math.abs(min);
  return v + Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0");
}

function rechne() {
  const arbeit = minuten($("ende").value) - minuten($("beginn").value) - minuten($("pause").value);
  let verteilt = 0;
  if (stand && stand.stand && stand.stand.zeilen) stand.stand.zeilen.forEach(z => verteilt += minuten(z.stunden));
  document.querySelectorAll("#zeilen .std").forEach(i => verteilt += minuten(i.value));
  const rest = arbeit - verteilt;

  $("rest").className = "rest" + (rest < 0 ? " warn" : "");
  $("rest").innerHTML =
    "<span>Arbeitszeit " + alsZeit(Math.max(arbeit, 0)) + " · verteilt " + alsZeit(verteilt) + "</span>" +
    "<b>" + (rest === 0 ? "vollständig" : alsZeit(rest) + (rest < 0 ? " zu viel" : " offen")) + "</b>";
}

// ═══════════ Senden ═══════════
async function senden() {
  melde("", "", "");
  $("senden").disabled = true;
  const beschriftung = $("senden").textContent;
  $("senden").textContent = "Wird übermittelt…";

  const daten = { art };
  if (art === "Arbeit") {
    daten.datum = $("datum").value;
    daten.beginn = $("beginn").value;
    daten.ende = $("ende").value;
    daten.pause = $("pause").value;
    daten.beschreibung = $("taetigkeit").value;
    daten.zeilen = [...document.querySelectorAll("#zeilen .zeile")].map(z => ({
      nr: z.querySelector(".nr").value.trim(),
      stunden: z.querySelector(".std").value,
      text: z.querySelector(".txt").value,
    })).filter(z => z.nr && z.stunden);
  } else {
    daten.von = $("von").value;
    daten.bis = $("bis").value || $("von").value;
  }

  try {
    const r = await api(F_ZEIT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(daten),
    });
    const d = await r.json();
    if (d.ok) {
      melde("ok", "Übermittelt", d.meldung);
      $("zeilen").innerHTML = "";
      if (art === "Arbeit") await ladeTag(); else neueZeile();
    } else {
      melde("err", "Nicht übermittelt", d.fehler || "Unbekannter Fehler.");
    }
  } catch (e) {
    melde("err", "Keine Verbindung", String(e.message || e));
  }

  $("senden").disabled = false;
  $("senden").textContent = beschriftung;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function melde(typ, titel, text) {
  $("meldung").innerHTML = typ
    ? '<div class="melde ' + typ + '">' + (titel ? '<b>' + esc(titel) + '</b>' : "") + esc(text) + '</div>' : "";
}

// ═══════════ Start ═══════════
const heute = new Date().toISOString().slice(0, 10);
$("datum").value = heute;
$("von").value = heute;
$("bis").value = heute;

$("anmelden").addEventListener("click", async () => {
  $("anmelden").disabled = true;
  try {
    await anmelden($("email").value.trim(), $("passwort").value);
    $("passwort").value = "";
    await starten();
  } catch (e) {
    zeigeLogin(String(e.message || e));
  }
  $("anmelden").disabled = false;
});
$("passwort").addEventListener("keydown", e => { if (e.key === "Enter") $("anmelden").click(); });

// ═══════════ Passwort ändern ═══════════
function pwMelde(typ, text) {
  $("pw-meldung").innerHTML = typ
    ? '<div class="melde ' + typ + '">' + esc(text) + '</div>' : "";
}

$("pw-link").addEventListener("click", () => {
  const auf = $("pw-card").style.display !== "none";
  $("pw-card").style.display = auf ? "none" : "";
  if (!auf) { pwMelde("", ""); $("pw-neu").value = ""; $("pw-neu2").value = ""; $("pw-neu").focus(); }
});

$("pw-abbrechen").addEventListener("click", () => { $("pw-card").style.display = "none"; });

$("pw-speichern").addEventListener("click", async () => {
  const a = $("pw-neu").value, b = $("pw-neu2").value;
  if (a.length < 8)  return pwMelde("err", "Das Passwort braucht mindestens 8 Zeichen.");
  if (a !== b)       return pwMelde("err", "Die beiden Eingaben stimmen nicht überein.");

  $("pw-speichern").disabled = true;
  $("pw-speichern").textContent = "Wird gespeichert…";
  try {
    const r = await api(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: a }),
    });
    const d = await r.json();
    if (r.ok) {
      pwMelde("ok", "Passwort geändert. Beim nächsten Anmelden gilt das neue.");
      $("pw-neu").value = ""; $("pw-neu2").value = "";
    } else {
      pwMelde("err", d.msg || d.error_description || d.message || "Ändern fehlgeschlagen.");
    }
  } catch (e) {
    pwMelde("err", String(e.message || e));
  }
  $("pw-speichern").disabled = false;
  $("pw-speichern").textContent = "Speichern";
});

$("pw-neu2").addEventListener("keydown", e => { if (e.key === "Enter") $("pw-speichern").click(); });

$("abmelden").addEventListener("click", abmelden);
$("datum").addEventListener("change", ladeTag);
["beginn", "ende", "pause"].forEach(id => $(id).addEventListener("input", rechne));
$("plus").addEventListener("click", neueZeile);
$("senden").addEventListener("click", senden);

zeichneArt();
umschalten();
starten();
</script>
</body>
</html>
